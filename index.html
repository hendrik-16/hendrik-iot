<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SKADUTA Smart Agriculture</title>
  <!-- Library Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
  <style>
    :root {
      --bg-main: #1a232a;
      --bg-sidebar: #13191d;
      --bg-card: #202b33;
      --accent-teal: #00c4b4;
      --accent-orange: #f39c12;
      --accent-red: #d94343;
      --text-color: #ffffff;
      --text-muted: #8b9da8;
    }

    * {
      box-sizing: border-box;
    }

    body {
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
      background-color: var(--bg-main);
      color: var(--text-color);
      margin: 0;
      display: flex;
      flex-direction: row;
      min-height: 100vh;
    }

    /* Sidebar Responsif */
    .sidebar {
      width: 250px;
      background-color: var(--bg-sidebar);
      padding: 20px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      flex-shrink: 0;
    }

    .logo {
      font-size: 1.3rem;
      font-weight: bold;
      color: var(--accent-teal);
    }

    .logo span {
      display: block;
      font-size: 0.9rem;
      color: var(--text-color);
    }

    /* Main Content */
    .main-content {
      flex: 1;
      padding: 20px;
      display: flex;
      flex-direction: column;
      gap: 20px;
      overflow-y: auto;
    }

    .header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 1.2rem;
      font-weight: bold;
      flex-wrap: wrap;
      gap: 10px;
    }

    /* Grid Switch Relay Responsif */
    .relay-container {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 15px;
    }

    .relay-card {
      background-color: var(--bg-card);
      padding: 15px;
      border-radius: 8px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Toggle Switch */
    .switch {
      position: relative;
      display: inline-block;
      width: 50px;
      height: 26px;
      flex-shrink: 0;
    }

    .switch input {
      opacity: 0;
      width: 0;
      height: 0;
    }

    .slider {
      position: absolute;
      cursor: pointer;
      top: 0; left: 0; right: 0; bottom: 0;
      background-color: var(--accent-red);
      transition: .3s;
      border-radius: 34px;
    }

    .slider:before {
      position: absolute;
      content: "";
      height: 18px;
      width: 18px;
      left: 4px;
      bottom: 4px;
      background-color: white;
      transition: .3s;
      border-radius: 50%;
    }

    input:checked + .slider {
      background-color: var(--accent-teal);
    }

    input:checked + .slider:before {
      transform: translateX(24px);
    }

    /* Grid Dashboard Utama */
    .dashboard-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
    }

    /* Kartu Grafik (Agak Lebar) */
    .chart-card {
      grid-column: span 2;
    }

    .data-card {
      background-color: var(--bg-card);
      border-radius: 10px;
      padding: 20px;
      display: flex;
      flex-direction: column;
    }

    .card-title {
      font-size: 1rem;
      font-weight: 600;
      margin-bottom: 15px;
      color: var(--text-muted);
    }

    /* Gauge / Inisialisasi Meter */
    .gauge-container {
      display: flex;
      justify-content: space-around;
      align-items: center;
      flex-wrap: wrap;
      gap: 15px;
    }

    .gauge-box {
      text-align: center;
      flex: 1;
      min-width: 120px;
    }

    .gauge-wrapper {
      position: relative;
      width: 100%;
      max-width: 180px;
      margin: 10px auto;
    }

    .gauge-value {
      position: absolute;
      bottom: 15%;
      left: 50%;
      transform: translate(-50%, 0);
      font-size: 1.2rem;
      font-weight: bold;
    }

    /* Media Queries untuk Perangkat HP / Tablet */
    @media (max-width: 900px) {
      .chart-card {
        grid-column: span 1;
      }
    }

    @media (max-width: 768px) {
      body {
        flex-direction: column;
      }

      .sidebar {
        width: 100%;
        padding: 15px 20px;
        flex-direction: row;
        align-items: center;
      }

      .dashboard-grid {
        grid-template-columns: 1fr;
      }

      .gauge-container {
        flex-direction: row;
      }
    }
  </style>
</head>
<body>

  <!-- Sidebar -->
  <div class="sidebar">
    <div class="logo">
      SKADUTA 
      <span>Smart Agriculture</span>
    </div>
    <div style="font-size:0.8rem; color:var(--text-muted);">
      v1.0.0 Hydroponic
    </div>
  </div>

  <!-- Main Content -->
  <div class="main-content">
    <div class="header">
      <div>SKADUTA Smart Hidroponik Panel</div>
      <div id="db-status" style="color: #f39c12;">Connecting...</div>
    </div>

    <!-- Sakelar Relay -->
    <div class="relay-container">
      <div class="relay-card">
        <span>Pompa pH Up</span>
        <label class="switch">
          <input type="checkbox" id="relay1" onchange="toggleRelay('relay1', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="relay-card">
        <span>Pompa pH Down</span>
        <label class="switch">
          <input type="checkbox" id="relay2" onchange="toggleRelay('relay2', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="relay-card">
        <span>Pompa Nutrisi A</span>
        <label class="switch">
          <input type="checkbox" id="relay3" onchange="toggleRelay('relay3', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
      <div class="relay-card">
        <span>Pompa Nutrisi B</span>
        <label class="switch">
          <input type="checkbox" id="relay4" onchange="toggleRelay('relay4', this.checked)">
          <span class="slider"></span>
        </label>
      </div>
    </div>

    <!-- Dashboard Monitoring -->
    <div class="dashboard-grid">
      <!-- Grafik Riwayat -->
      <div class="data-card chart-card">
        <div class="card-title">Grafik Riwayat pH & TDS</div>
        <div style="position: relative; width: 100%; min-height: 250px;">
          <canvas id="sensorGraph"></canvas>
        </div>
      </div>

      <!-- Gauge pH & TDS -->
      <div class="data-card">
        <div class="card-title">Monitoring Sensor</div>
        <div class="gauge-container">
          <div class="gauge-box">
            <div style="font-size: 0.9rem;">Kadar pH</div>
            <div class="gauge-wrapper">
              <canvas id="phGauge"></canvas>
              <div class="gauge-value" id="phText" style="color: var(--accent-teal);">0.0</div>
            </div>
          </div>
          <div class="gauge-box">
            <div style="font-size: 0.9rem;">TDS (PPM)</div>
            <div class="gauge-wrapper">
              <canvas id="tdsGauge"></canvas>
              <div class="gauge-value" id="tdsText" style="color: var(--accent-orange);">0 PPM</div>
            </div>
          </div>
        </div>
      </div>

      <!-- Status Informasi -->
      <div class="data-card">
        <div class="card-title">Status Nutrisi & Air</div>
        <div style="display: flex; flex-direction: column; gap: 12px; font-size: 0.9rem;">
          <div>Update Terakhir: <br><strong id="last-update">-</strong></div>
          <div>Status pH: <br><strong id="ph-status" style="color: var(--accent-teal);">Normal</strong></div>
          <div>Status TDS: <br><strong id="tds-status" style="color: var(--accent-orange);">Normal</strong></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Integrasi Firebase JS SDK -->
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // Konfigurasi Firebase Anda
  const firebaseConfig = {
  apiKey: "AIzaSyBrhYFBHJkCgH0xyxTv5dr8nOrO99SOzQs",
  authDomain: "smart-agriculture-hendrik.firebaseapp.com",
  databaseURL: "https://smart-agriculture-hendrik-default-rtdb.firebaseio.com",
  projectId: "smart-agriculture-hendrik",
  storageBucket: "smart-agriculture-hendrik.firebasestorage.app",
  messagingSenderId: "639517546584",
  appId: "1:639517546584:web:ff7e8a5f653bd7f7bb122d"
};
    const app = initializeApp(firebaseConfig);
    const database = getDatabase(app);

    // Fungsi Kontrol Relay
    window.toggleRelay = function (relayId, isChecked) {
      set(ref(database, 'agriculture_iot/relays/' + relayId), isChecked)
        .then(() => console.log(`Berhasil update ${relayId}: ${isChecked}`))
        .catch(error => console.error("Error update relay:", error));
    };

    // Inisialisasi Chart Line
    const ctxGraph = document.getElementById('sensorGraph').getContext('2d');
    const sensorChart = new Chart(ctxGraph, {
      type: 'line',
      data: {
        labels: [],
        datasets: [
          { label: 'pH Air', data: [], borderColor: '#00c4b4', yAxisID: 'yPh', tension: 0.2 },
          { label: 'TDS (PPM)', data: [], borderColor: '#f39c12', yAxisID: 'yTds', tension: 0.2 }
        ]
      },
      options: { 
        responsive: true, 
        maintainAspectRatio: false,
        scales: {
          yPh: { type: 'linear', position: 'left', min: 0, max: 14 },
          yTds: { type: 'linear', position: 'right', min: 0, max: 2000 }
        }
      }
    });

    // Inisialisasi Gauge
    function createGauge(elementId, color) {
      return new Chart(document.getElementById(elementId).getContext('2d'), {
        type: 'doughnut',
        data: { 
          datasets: [{ data: [0, 100], backgroundColor: [color, '#13191d'], borderWidth: 0 }] 
        },
        options: { rotation: -135, circumference: 270, cutout: '80%', responsive: true }
      });
    }

    const phGaugeChart = createGauge('phGauge', '#00c4b4');
    const tdsGaugeChart = createGauge('tdsGauge', '#f39c12');

    // Mendengarkan Data Realtime
    const iotRef = ref(database, 'agriculture_iot');
    onValue(iotRef, (snapshot) => {
      const data = snapshot.val();
      const statusElem = document.getElementById('db-status');
      if (statusElem) {
        statusElem.innerText = "Terhubung";
        statusElem.style.color = "#00c4b4";
      }

      if (data) {
        const timeNow = new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });

        // Update pH
        if (data.ph !== undefined) {
          const ph = parseFloat(data.ph);
          document.getElementById('phText').innerText = ph.toFixed(2);
          phGaugeChart.data.datasets[0].data = [ph, Math.max(0, 14 - ph)];
          phGaugeChart.update();
        }

        // Update TDS
        if (data.tds !== undefined) {
          const tds = parseFloat(data.tds);
          document.getElementById('tdsText').innerText = Math.round(tds) + " PPM";
          tdsGaugeChart.data.datasets[0].data = [Math.min(tds, 2000), Math.max(0, 2000 - Math.min(tds, 2000))];
          tdsGaugeChart.update();
        }

        // Update Line Chart
        if (data.ph !== undefined && data.tds !== undefined) {
          sensorChart.data.labels.push(timeNow);
          sensorChart.data.datasets[0].data.push(parseFloat(data.ph));
          sensorChart.data.datasets[1].data.push(parseFloat(data.tds));

          if (sensorChart.data.labels.length > 7) {
            sensorChart.data.labels.shift();
            sensorChart.data.datasets[0].data.shift();
            sensorChart.data.datasets[1].data.shift();
          }
          sensorChart.update();
        }

        document.getElementById('last-update').innerText = timeNow;

        // Sync Status Relay
        if (data.relays) {
          for (let i = 1; i <= 4; i++) {
            const rToggle = document.getElementById('relay' + i);
            if (rToggle && data.relays['relay' + i] !== undefined) {
              rToggle.checked = data.relays['relay' + i];
            }
          }
        }
      }
    });
  </script>
</body>
</html>
